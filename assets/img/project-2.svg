<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="360" fill="url(#p2-bg)"/>
  
  <!-- Browser Frame -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="30" width="520" height="35" rx="12" fill="#1e293b"/>
  <!-- Browser Dots -->
  <circle cx="65" cy="47" r="6" fill="#ef4444"/>
  <circle cx="85" cy="47" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="47" r="6" fill="#10b981"/>
  <rect x="140" y="40" width="280" height="15" rx="7" fill="#0f172a"/>

  <!-- Task App Interface -->
  <!-- Sidebar -->
  <rect x="60" y="85" width="120" height="225" rx="8" fill="#1e293b"/>
  <rect x="75" y="105" width="90" height="12" rx="4" fill="#10b981"/>
  <rect x="75" y="130" width="70" height="8" rx="4" fill="#64748b"/>
  <rect x="75" y="150" width="80" height="8" rx="4" fill="#64748b"/>
  <rect x="75" y="170" width="60" height="8" rx="4" fill="#64748b"/>
  <rect x="75" y="190" width="75" height="8" rx="4" fill="#64748b"/>
  
  <!-- Task Columns -->
  <!-- Column 1: Pendiente -->
  <g transform="translate(195, 85)">
    <rect x="0" y="0" width="165" height="225" rx="8" fill="#1e293b"/>
    <text x="12" y="25" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">PENDIENTES</text>
    
    <rect x="10" y="38" width="145" height="50" rx="6" fill="#334155"/>
    <rect x="20" y="50" width="90" height="8" rx="2" fill="#f1f5f9"/>
    <rect x="20" y="65" width="60" height="6" rx="2" fill="#94a3b8"/>
    
    <rect x="10" y="98" width="145" height="50" rx="6" fill="#334155"/>
    <rect x="20" y="110" width="110" height="8" rx="2" fill="#f1f5f9"/>
    <rect x="20" y="125" width="50" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Column 2: Completado -->
  <g transform="translate(375, 85)">
    <rect x="0" y="0" width="165" height="225" rx="8" fill="#1e293b"/>
    <text x="12" y="25" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">COMPLETADAS</text>
    
    <rect x="10" y="38" width="145" height="50" rx="6" fill="#1e3a34"/>
    <circle cx="25" cy="54" r="7" fill="#10b981"/>
    <line x1="22" y1="54" x2="25" y2="57" stroke="#fff" stroke-width="2"/>
    <line x1="25" y1="57" x2="29" y2="51" stroke="#fff" stroke-width="2"/>
    <rect x="40" y="50" width="85" height="8" rx="2" fill="#6ee7b7"/>
    <rect x="40" y="65" width="50" height="6" rx="2" fill="#34d399"/>
    
    <rect x="10" y="98" width="145" height="50" rx="6" fill="#1e3a34"/>
    <circle cx="25" cy="114" r="7" fill="#10b981"/>
    <line x1="22" y1="114" x2="25" y2="117" stroke="#fff" stroke-width="2"/>
    <line x1="25" y1="117" x2="29" y2="111" stroke="#fff" stroke-width="2"/>
    <rect x="40" y="110" width="95" height="8" rx="2" fill="#6ee7b7"/>
    <rect x="40" y="125" width="60" height="6" rx="2" fill="#34d399"/>
  </g>
</svg>

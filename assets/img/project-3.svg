<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="360" fill="url(#p3-bg)"/>
  
  <!-- Browser Frame -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="30" width="520" height="35" rx="12" fill="#1e293b"/>
  <!-- Browser Dots -->
  <circle cx="65" cy="47" r="6" fill="#ef4444"/>
  <circle cx="85" cy="47" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="47" r="6" fill="#10b981"/>
  <rect x="140" y="40" width="280" height="15" rx="7" fill="#0f172a"/>

  <!-- Weather App Interface -->
  <!-- Search input mock -->
  <rect x="170" y="80" width="260" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="190" cy="96" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="195" y1="101" x2="202" y2="108" stroke="#94a3b8" stroke-width="2"/>
  <rect x="212" y="93" width="120" height="7" rx="3" fill="#64748b"/>

  <!-- Main Weather Card -->
  <rect x="80" y="130" width="440" height="175" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Sun & Cloud -->
  <circle cx="150" cy="190" r="32" fill="url(#sun-grad)"/>
  <ellipse cx="175" cy="205" rx="35" ry="22" fill="#94a3b8" opacity="0.85"/>
  <ellipse cx="205" cy="205" rx="25" ry="18" fill="#cbd5e1" opacity="0.85"/>

  <!-- Temperature and Info -->
  <text x="245" y="195" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="bold">24°C</text>
  <text x="245" y="222" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Soleado con nubes dispersas</text>
  <text x="245" y="245" fill="#94a3b8" font-family="sans-serif" font-size="12">Humedad: 55% | Viento: 12 km/h</text>
  
  <!-- Forecast mini cards -->
  <g transform="translate(385, 150)">
    <rect x="0" y="0" width="115" height="42" rx="6" fill="#0f172a"/>
    <text x="12" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="11">Mañana: 22°C</text>
    <rect x="0" y="52" width="115" height="42" rx="6" fill="#0f172a"/>
    <text x="12" y="77" fill="#cbd5e1" font-family="sans-serif" font-size="11">Viernes: 26°C</text>
    <rect x="0" y="104" width="115" height="42" rx="6" fill="#0f172a"/>
    <text x="12" y="129" fill="#cbd5e1" font-family="sans-serif" font-size="11">Sábado: 21°C</text>
  </g>
</svg>
